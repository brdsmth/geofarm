<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>geofarm</title>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div id="map"></div>

    <div id="farm">
      <div id="farm-name"></div>
      <div id="farm-status" aria-live="polite"></div>
      <label id="viewer-label" hidden><span id="viewer-caption"></span><select id="viewer"></select></label>
    </div>

    <div id="notice" hidden role="status" aria-live="polite"></div>

    <div id="search">
      <input id="search-input" type="search" autocomplete="off" />
      <div id="search-results" hidden></div>
    </div>

    <div id="shown">
      <button id="shown-toggle" aria-expanded="false" aria-controls="shown-list"></button>
      <div id="shown-list" hidden></div>
    </div>

    <div id="hint"></div>

    <button id="draw-ask"></button>

    <aside id="panel" hidden>
      <button id="panel-close">×</button>
      <div id="panel-body"></div>
    </aside>

    <div id="timeline">
      <div id="season-caption"></div>
      <button id="today" hidden></button>
      <div id="season-label"></div>
      <input id="season" type="range" min="0" max="90" value="90" step="1" />
      <div id="ticks"></div>
    </div>

    <div id="tooltip" hidden></div>
  </body>
</html>
