<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>geofarm</title>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div id="map"></div>

    <div id="brand">
      <span id="brand-name"></span>
      <label id="viewer-label"><span id="viewer-caption"></span><select id="viewer"></select></label>
    </div>

    <div id="search">
      <input id="search-input" type="search" autocomplete="off" />
      <div id="search-results" hidden></div>
    </div>

    <div id="layers"></div>

    <div id="hint"></div>

    <div id="status"></div>

    <button id="draw-ask"></button>

    <aside id="panel" hidden>
      <button id="panel-close">×</button>
      <div id="panel-body"></div>
    </aside>

    <div id="timeline">
      <button id="today" hidden></button>
      <div id="season-label"></div>
      <input id="season" type="range" min="0" max="90" value="90" step="1" />
      <div id="ticks"></div>
    </div>

    <div id="tooltip" hidden></div>
  </body>
</html>
